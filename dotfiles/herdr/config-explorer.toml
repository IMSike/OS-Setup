# herdr : réglages déployés par OS-Setup (seuls les écarts aux valeurs par défaut),
# avec les raccourcis du plugin explorer (gcaudan/herdr-explorer).
# Même contenu que config.toml, plus les raccourcis en fin de fichier : modifier les deux ensemble.
# Liste complète des options : https://herdr.dev/docs/configuration/
onboarding = false

[theme]
name = "gruvbox"
auto_switch = false

[terminal]
default_shell = "pwsh.exe"

[ui]
sidebar_width = 26
mouse_scroll_lines = 5
prompt_new_tab_name = false
pane_gaps = false

[ui.toast]
delivery = "system"

[experimental]
pane_history = false

[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "gcaudan.explorer.toggle"
description = "file explorer"

[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "gcaudan.explorer.search"
description = "go to file"

[[keys.command]]
key = "prefix+d"
type = "plugin_action"
command = "gcaudan.explorer.scm"
description = "source control"
